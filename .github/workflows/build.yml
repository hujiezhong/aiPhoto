name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:    # 手动触发

jobs:
  test:
    name: Build & Test on macOS
    runs-on: macos-15    # macOS 15 + Xcode 16（xcodegen 生成 Xcode 16 格式）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project aiPhoto.xcodeproj \
            -scheme aiPhoto \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            build

      - name: Run unit tests (unsigned)
        run: |
          xcodebuild test \
            -project aiPhoto.xcodeproj \
            -scheme aiPhoto \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug

  signed-ipa:
    name: Signed .ipa (for sideload)
    runs-on: macos-15
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 仅在 push 到 main 时跑（避免 PR 触发）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ========== 签名材料准备 ==========
      - name: Decode signing materials from secrets
        env:
          P12_B64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISION_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          # 创建临时 keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          rm -f "$KEYCHAIN_PATH" "$KEYCHAIN_PATH-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 写入 .p12
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A -T /usr/bin/codesign

          # 写入 provisioning profile
          echo "$PROVISION_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo "✅ Signing materials imported"

      # ========== Build & Archive ==========
      - name: Archive
        run: |
          xcodebuild \
            -project aiPhoto.xcodeproj \
            -scheme aiPhoto \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/aiPhoto.xcarchive" \
            CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="aiPhoto" \
            archive

      - name: Export .ipa
        run: |
          # 写临时 exportOptions.plist
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/aiPhoto.xcarchive" \
            -exportPath "$RUNNER_TEMP/build" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: List output
        run: ls -la "$RUNNER_TEMP/build/"

      - name: Upload .ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiPhoto-${{ github.sha }}
          path: ${{ runner.temp }}/build/*.ipa
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision"