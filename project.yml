name: aiPhoto
options:
  bundleIdPrefix: com.aiphoto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    PRODUCT_BUNDLE_IDENTIFIER: com.aiphoto.app
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  aiPhoto:
    type: application
    platform: iOS
    sources:
      - path: aiPhoto
        excludes:
          - "Info.plist"
    resources: []
    info:
      path: aiPhoto/Info.plist
      properties:
        CFBundleDisplayName: aiPhoto
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        NSCameraUsageDescription: "aiPhoto 需要使用相机以拍照和实时预览"
        NSPhotoLibraryAddUsageDescription: "aiPhoto 需要将拍摄的照片保存到相册"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    dependencies: []

  aiPhotoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: aiPhotoTests
    dependencies:
      - target: aiPhoto
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/aiPhoto.app/aiPhoto

  aiPhotoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: aiPhotoTests/UI
    dependencies:
      - target: aiPhoto
    settings:
      base:
        TEST_TARGET_NAME: aiPhoto
